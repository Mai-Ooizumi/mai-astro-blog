version: 2
updates:
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 10
    groups:
      astro:
        patterns:
          - "astro"
          - "@astrojs/*"
      biome:
        patterns:
          - "@biomejs/*"
      shiki-unified:
        patterns:
          - "remark-*"
          - "rehype-*"
          - "unified"
          - "shiki"

  - package-ecosystem: "github-actions"
    directory: "/.github/workflows"
    schedule:
      interval: "weekly"
